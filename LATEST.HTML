<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do You Love Me?</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffe4e9;           /* Light Pink Background */
      --text-main: #d60000;    /* Passionate Red */
      --btn-yes: #ff0040;      /* Hot Pink */
      --btn-no: #1e3a8a;       /* Deep Blue */
    }

    body {
      background-color: var(--bg);
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewport="0 0 24 24" fill="%23ff0040"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>'), auto;
    }

    /* Background Animation */
    .bg-gradient {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255,255,255,0.8) 0%, rgba(255,228,233,1) 100%);
      z-index: -1;
    }

    /* Flying Hearts Background */
    .heart-bg {
      position: absolute;
      color: rgba(255, 0, 64, 0.2);
      animation: floatUp linear infinite;
      z-index: 0;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    /* Card Style */
    .card {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(10px);
      padding: 3rem;
      border-radius: 2rem;
      text-align: center;
      box-shadow: 0 10px 30px rgba(214, 0, 0, 0.1);
      border: 2px solid #fff;
      z-index: 10;
      max-width: 90%;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3.5rem;
      color: var(--text-main);
      margin-bottom: 2rem;
      text-shadow: 2px 2px 0px rgba(255,255,255,0.5);
    }

    /* YES Button */
    .btn-yes {
      background: linear-gradient(45deg, #ff0040, #ff5e7e);
      color: white;
      padding: 1rem 3rem;
      font-size: 1.5rem;
      border-radius: 50px;
      box-shadow: 0 5px 15px rgba(255, 0, 64, 0.4);
      transition: transform 0.2s;
      border: none;
      cursor: pointer;
    }
    .btn-yes:hover {
      transform: scale(1.1);
    }

    /* NO Button - THE GHOST (Vuture) STYLE */
    .btn-no {
      position: fixed; /* Fixed position to fly around screen */
      color: var(--btn-no);
      font-weight: bold;
      font-size: 1.2rem;
      background: transparent;
      border: 2px solid var(--btn-no);
      padding: 0.5rem 1.5rem;
      border-radius: 50px;
      cursor: pointer;
      pointer-events: auto; 
      
      /* The Blink and Float Animation */
      animation: ghostBlink 1.5s infinite ease-in-out;
      opacity: 0; /* Starts invisible */
      transition: top 0.1s, left 0.1s; /* Fast movement */
    }

    @keyframes ghostBlink {
      0% { opacity: 0; transform: scale(0.8) translateY(10px); }
      50% { opacity: 1; transform: scale(1.1) translateY(0px); filter: blur(0px); }
      100% { opacity: 0; transform: scale(0.8) translateY(-10px); filter: blur(2px); }
    }

    /* Success Message */
    .success-box {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255,228,233, 0.95);
      z-index: 50;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    
    .success-text {
      font-size: 4rem;
      color: #d60000;
      font-family: 'Playfair Display', serif;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }

  </style>
</head>
<body>

  <div class="bg-gradient"></div>
  <div id="heartContainer"></div>

  <div class="card" id="mainCard">
    <h1>Do You Love Me?</h1>
    <div class="flex justify-center gap-8 items-center relative h-20">
      <button class="btn-yes" id="yesBtn">YES</button>
      <button class="btn-no" id="noBtn">NO</button>
    </div>
  </div>

  <div class="success-box" id="successBox">
    <h1 class="success-text">I Knew It! ❤️</h1>
    <p style="font-size: 1.5rem; color: #1e3a8a; margin-top: 10px;">Love You Too!</p>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const mainCard = document.getElementById('mainCard');
    const successBox = document.getElementById('successBox');
    const heartContainer = document.getElementById('heartContainer');

    // 1. Background Hearts Generation (Lust atmosphere)
    function createBackgroundHearts() {
      for(let i=0; i<30; i++) {
        const heart = document.createElement('div');
        heart.innerHTML = '❤';
        heart.className = 'heart-bg';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.fontSize = (Math.random() * 2 + 1) + 'rem';
        heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
        heart.style.animationDelay = (Math.random() * 5) + 's';
        heartContainer.appendChild(heart);
      }
    }
    createBackgroundHearts();

    // 2. The "Ghost" Logic for NO Button
    // এটি মাউস কাছে আসার আগেই সরে যাবে + অটোমেটিক সরবে
    
    function moveNoButton() {
      // Calculate random position
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 50);
      
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
      
      // Reset animation to make it blink fresh in new spot
      noBtn.style.animation = 'none';
      noBtn.offsetHeight; /* trigger reflow */
      noBtn.style.animation = 'ghostBlink 1.2s infinite ease-in-out';
    }

    // Move automatically every 900ms (so it appears and disappears constantly)
    let autoMove = setInterval(moveNoButton, 900);

    // Move IMMEDIATELY on Hover (Mouse enter)
    // মাউস টাচ করার আগেই সরে যাবে
    document.addEventListener('mousemove', (e) => {
      const btnRect = noBtn.getBoundingClientRect();
      const mouseX = e.clientX;
      const mouseY = e.clientY;

      // Distance check: If mouse is within 100px of the button
      const distance = Math.sqrt(
        Math.pow(mouseX - (btnRect.left + btnRect.width/2), 2) + 
        Math.pow(mouseY - (btnRect.top + btnRect.height/2), 2)
      );

      if (distance < 150) { // 150px range - very sensitive!
        moveNoButton();
        // Reset the auto timer so it doesn't double jump
        clearInterval(autoMove);
        autoMove = setInterval(moveNoButton, 900);
      }
    });

    // Just in case they are super fast clickers
    noBtn.addEventListener('click', (e) => {
      e.preventDefault();
      moveNoButton();
    });

    // 3. YES Button Logic
    yesBtn.addEventListener('click', () => {
      mainCard.style.display = 'none';
      noBtn.style.display = 'none'; // Stop the ghost
      successBox.style.display = 'flex';
      
      // Explosion of hearts
      for(let i=0; i<50; i++) {
        setTimeout(() => {
          const heart = document.createElement('div');
          heart.innerHTML = '❤';
          heart.style.position = 'fixed';
          heart.style.left = Math.random() * 100 + 'vw';
          heart.style.top = '110vh';
          heart.style.color = Math.random() > 0.5 ? '#ff0040' : '#d60000';
          heart.style.fontSize = (Math.random() * 3 + 1) + 'rem';
          heart.style.transition = 'all 2s ease-out';
          heart.style.zIndex = '100';
          document.body.appendChild(heart);

          setTimeout(() => {
            heart.style.top = '-10vh';
            heart.style.opacity = '0';
          }, 100);
        }, i * 50);
      }
    });

  </script>
</body>
</html>
